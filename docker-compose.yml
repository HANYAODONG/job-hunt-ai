services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: jobmatch_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - jobmatch_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  neo4j:
    image: neo4j:5.14-community
    container_name: jobmatch_neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - jobmatch_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend-src
      dockerfile: Dockerfile
    image: jobmatch-ai-backend:local
    container_name: jobmatch_backend
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - SENTENCE_TRANSFORMER_MODEL=BAAI/bge-m3
      - HF_ENDPOINT=https://hf-mirror.com
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - ENABLE_LLM_RESUME_PARSER=${ENABLE_LLM_RESUME_PARSER:-true}
      - LLM_RESUME_PROVIDER=${LLM_RESUME_PROVIDER:-deepseek}
      - LLM_RESUME_API_KEY=${LLM_RESUME_API_KEY:-}
      - LLM_RESUME_BASE_URL=${LLM_RESUME_BASE_URL:-https://api.deepseek.com}
      - LLM_RESUME_MODEL=${LLM_RESUME_MODEL:-deepseek-chat}
      - LLM_RESUME_TIMEOUT=${LLM_RESUME_TIMEOUT:-150}
      - LLM_RESUME_MAX_TEXT_CHARS=${LLM_RESUME_MAX_TEXT_CHARS:-12000}
      - LLM_RESUME_MAX_TOKENS=${LLM_RESUME_MAX_TOKENS:-1200}
      - JOB_UPDATE_TEXT2VEC_MODEL=${JOB_UPDATE_TEXT2VEC_MODEL:-shibing624/text2vec-base-chinese}
      - ENABLE_SPACY_MODEL=${ENABLE_SPACY_MODEL:-false}
      - ENABLE_SENTENCE_TRANSFORMER=${ENABLE_SENTENCE_TRANSFORMER:-false}
      # Demo startup stays deterministic and avoids repeated model-download retries.
      # Set the model switches to true and offline values to 0 for model downloads.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - JOB_HUNT_REPO_ROOT=/app
      - SEMANTIC_INDEX_PATH=/app/artifacts/semantic_index/jobs_embeddings.npy
      - SEMANTIC_INDEX_IDS=/app/artifacts/semantic_index/jobs_embedding_ids.json
      - PORT=8000
    ports:
      - "${BACKEND_PORT:-18088}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./artifacts:/app/artifacts
      - ./backend-src/app:/app/app
      - ./backend-src/scripts:/app/scripts
    depends_on:
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - jobmatch_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  frontend:
    build:
      context: ./frontend-src
      dockerfile: Dockerfile
    image: jobmatch-ai-frontend:local
    container_name: jobmatch_frontend
    environment:
      - REACT_APP_API_URL=/api/v1
      - API_PROXY_TARGET=http://backend:8000
      - REACT_APP_USE_MOCK_DATA=false
      - HOST=0.0.0.0
      - WDS_SOCKET_PORT=18080
    ports:
      - "${FRONTEND_PORT:-18080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jobmatch_network
    restart: unless-stopped

volumes:
  elasticsearch_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  jobmatch_network:
    driver: bridge
